[project]
name = "retail-medallion-pipeline"
version = "0.1.0"
description = "Medallion (bronze/silver/gold) pipeline for simulated retail POS data on Postgres + dbt"
requires-python = ">=3.13"
dependencies = [
    "dbt-postgres>=1.11.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
]
